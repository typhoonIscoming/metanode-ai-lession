[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-arb"
version = "0.1.0"
description = "Polymarket BTC 套利信号工具后端"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "polymarket-arb team" }]

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.32",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<0.31",
    "apscheduler>=3.10,<4",
    "httpx>=0.27,<0.28",
    "tenacity>=8.3,<9",
    "structlog>=24.1,<25",
    "openai>=1.40,<2",
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<0.28",
    "testcontainers[postgres]>=4.7,<5",
    "ruff>=0.5,<0.7",
    "freezegun>=1.5,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: 单元测试，无 IO，无 DB",
    "integration: 集成测试，需要 testcontainers-postgres",
    "contract: 契约测试，验证外部 API schema 与 parser 对齐",
    "slow: 单 case > 1s，CI 可选跳过",
]
filterwarnings = [
    "error",
    # SQLAlchemy 2 在某些 asyncpg 路径下会抛 DeprecationWarning，先放行
    "ignore::DeprecationWarning:sqlalchemy.*",
    # httpx async client 关闭顺序在 testclient 路径下会偶发 ResourceWarning
    "ignore::ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["src/btc_arb"]
omit = [
    "src/btc_arb/main.py",
    "src/btc_arb/__init__.py",
    "src/btc_arb/*/__init__.py",
    "src/btc_arb/card_templates/*",
    "alembic/*",
    "tests/*",
]
data_file = ".coverage"
parallel = false
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
# 注意：fail_under 不在此设置 —— 仅在 `make test-cov-strict` 走 CLI `--cov-fail-under=80`。
# 原因：build-out 阶段（业务代码尚未实装）`make test-cov` 应纯报告不阻断；
# pre-merge 流水线由 `make test-cov-strict` 启用整体 80% + per-file 95/85 分级门禁。

[tool.coverage.json]
output = "coverage.json"
show_contexts = false

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
